plugins {
    id 'com.android.application' version '8.7.2'
}

android {
    namespace 'app.odicto.keyboardtrial'
    compileSdk 35
    defaultConfig {
        applicationId 'app.odicto.keyboardtrial'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
