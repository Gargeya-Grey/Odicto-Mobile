apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "app.odicto.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "app.odicto.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // A font kept as a file descriptor is what lets Typeface.Builder resolve the variable
            // axes in Lora[wght].ttf. Compressed, Android substitutes a system face without error.
            noCompress 'ttf'
        }
    }
    // Release signing comes only from the environment (CI secrets or the owner's shell).
    // Without all four values, assembleRelease produces an unsigned APK that will not install.
    def releaseKeystore = System.getenv("ODICTO_KEYSTORE_FILE")
    def releaseSigningReady = releaseKeystore && System.getenv("ODICTO_KEYSTORE_PASSWORD") &&
        System.getenv("ODICTO_KEY_ALIAS") && System.getenv("ODICTO_KEY_PASSWORD")
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ODICTO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ODICTO_KEY_ALIAS")
                keyPassword System.getenv("ODICTO_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
